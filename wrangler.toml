name = "postervia-web"
compatibility_date = "2024-11-01"
main = "worker.js"

# Static assets in public/ are matched FIRST (run_worker_first defaults to
# false). The Worker in worker.js only sees requests that didn't match an
# asset (e.g. /privacy → no privacy file, only privacy.html), and 301-redirects
# them to the .html version. This avoids needing env.ASSETS at runtime — a
# known undefined-binding issue with Cloudflare's auto-build flow.
[assets]
directory = "./public"

[vars]
# App Store Connect campaign provider token (pt=). Empty until lisum obtains
# it; while empty /get sends the plain store URL. The value is public (it is
# part of every campaign URL), so it belongs here, not in a secret.
APPLE_PT = ""

# Keeps console.log lines (get_click) visible in the dashboard for 3 days.
# Invocation logs stay off: they carry request metadata we do not want to keep.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
